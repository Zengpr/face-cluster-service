name: CIon:  push:    branches: [main, master]  pull_request:    branches: [main, master]jobs:  unit-tests:    name: Unit & API tests    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - uses: actions/setup-python@v5        with:          python-version: "3.11"          cache: "pip"      - name: Install Python deps        run: |          python -m pip install --upgrade pip          pip install -r requirements.txt          pip install -r tests/requirements-test.txt          pip install pillow      - name: Run pytest        run: pytest -v --html=pytest_report.html || true        continue-on-error: true      - name: Upload report        if: always()        uses: actions/upload-artifact@v4        with:          name: pytest-report          path: pytest_report.html          if-no-files-found: ignore  docker-build-check:    name: Docker build sanity    runs-on: ubuntu-latest    timeout-minutes: 30    steps:      - uses: actions/checkout@v4      - name: Set up Docker Buildx        uses: docker/setup-buildx-action@v3      - name: Build image        uses: docker/build-push-action@v5        with:          context: .          push: false          tags: face-cluster-service:ci          load: true          cache-from: type=gha          cache-to: type=gha,mode=max      - name: Smoke test container start        run: |          docker run -d --name fc-ci -p 8000:8000 \            -e REDIS_URL=redis://localhost:6379/0 \            -e DETECTOR_NAME=buffalo_l \            face-cluster-service:ci          sleep 30          docker logs fc-ci          curl -sS http://localhost:8000/health || echo "health not ready (still downloads model)"          docker stop fc-ci || true